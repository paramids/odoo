services:
  # PostgreSQL Database - Production Configuration
  db:
    image: postgres:15-alpine
    container_name: odoo-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - postgres_backups:/backups
    networks:
      - odoo-backend
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # Odoo Application - Production Configuration
  odoo:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    image: odoo-production:latest
    container_name: odoo-app-prod
    ports:
      - "8069:8069"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database configuration
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-odoo}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-odoo}
      
      # Production configuration
      ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
      WORKERS: ${ODOO_WORKERS:-4}
      MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-2}
      LOG_LEVEL: ${ODOO_LOG_LEVEL:-warn}
      
      # Security settings
      LIST_DB: "false"
      PROXY_MODE: "true"
      
      # Performance settings
      LIMIT_MEMORY_HARD: ${ODOO_LIMIT_MEMORY_HARD:-2684354560}
      LIMIT_MEMORY_SOFT: ${ODOO_LIMIT_MEMORY_SOFT:-2147483648}
      LIMIT_TIME_CPU: ${ODOO_LIMIT_TIME_CPU:-600}
      LIMIT_TIME_REAL: ${ODOO_LIMIT_TIME_REAL:-1200}
      LIMIT_REQUEST: ${ODOO_LIMIT_REQUEST:-8192}
      
      # Additional security
      WITHOUT_DEMO: "all"
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_backups:/backups
    networks:
      - odoo-backend
      - odoo-frontend
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/log/odoo:noexec,nosuid,size=100m
    command: ["odoo", "--database=${POSTGRES_DB:-odoo}"]

  # Nginx Reverse Proxy (Optional but recommended for production)
  nginx:
    image: nginx:alpine
    container_name: odoo-nginx-prod
    restart: always
    depends_on:
      - odoo
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx-odoo.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
      - ssl_certs:/etc/ssl/certs:ro
    networks:
      - odoo-frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/web/database/selector"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # Redis for Session Storage (Optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: odoo-redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - odoo-backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres
  postgres_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_PATH:-./backups}/postgres
  odoo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/odoo
  odoo_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_PATH:-./backups}/odoo
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  ssl_certs:
    driver: local

# Isolated networks for security
networks:
  odoo-backend:
    driver: bridge
    internal: true  # No external access
  odoo-frontend:
    driver: bridge

# Production deployment configuration
x-deploy: &default-deploy
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s 