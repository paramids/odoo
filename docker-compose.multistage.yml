services:
  db:
    image: postgres:15
    container_name: odoo-postgres-multistage
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_multistage:/var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    networks:
      - odoo-network-multistage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 30s
      timeout: 10s
      retries: 3

  odoo:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    container_name: odoo-app-multistage
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database configuration
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: odoo
      DB_PASSWORD: odoo123
      
      # Odoo configuration
      ADMIN_PASSWORD: admin123
      WORKERS: 2
      MAX_CRON_THREADS: 2
      LOG_LEVEL: info
    volumes:
      # Persistent data storage
      - odoo_data_multistage:/var/lib/odoo
      - odoo_logs_multistage:/var/log/odoo
    ports:
      - "8070:8069"
    networks:
      - odoo-network-multistage
    restart: unless-stopped
    command: ["odoo", "--database=rd-demo"]

volumes:
  postgres_data_multistage:
    driver: local
  odoo_data_multistage:
    driver: local
  odoo_logs_multistage:
    driver: local

networks:
  odoo-network-multistage:
    driver: bridge 